[workspace]
members = [
    "zee",
    "zee-edit",
    "zee-grammar",
    "zee-highlight",
]
resolver = "2"

[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3
panic = "unwind"
strip = false

[patch.crates-io]
# zi = { git = "https://github.com/qezz/zi.git", tag = "zi-v0.3.2", pacakge = "zi" }
# zi-term = { git = "https://github.com/qezz/zi.git", tag = "zi-v0.3.2", pacakge = "zi-term" }

zi = { path = "../zi/zi", pacakge = "zi" }
zi-term = { path = "../zi/zi-term", pacakge = "zi-term" }

